<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="documentStyle.css" />
    <link rel="stylesheet" href="treeStyle.css" />
    <title>Tree node sample</title>
</head>
<body>
    <div class="tree_view">
        <div class="tree_node" style="position:absolute; top:0; left:0">
            <div class="justified_center top_connection dot"></div>
            <div class="inner_body">
                <h1>Node Type</h1>
                <input class="node_input without_border extra_bottom_margin" type="text" value="Node Name"/>
                <table class="without_border">
                    <tr>
                        <td><label for="port_value">Port Name</label></td>
                        <td><input class="port node_input" type="text" name="port_value"/></td>
                    </tr>
                </table>        
            </div>
            <div class="justified_center bottom_connection dot"></div>
        </div>

        <div class="tree_node" style="position:absolute; top:150px; left:0">
            <div class="justified_center top_connection dot"></div>
            <div class="inner_body">
                <h1>Node Type</h1>
                <input class="node_input without_border extra_bottom_margin" type="text" value="Node Name"/>
                <table class="without_border">
                    <tr>
                        <td><label for="port_value">Port Name</label></td>
                        <td><input class="port node_input" type="text" name="port_value"/></td>
                    </tr>
                </table>        
            </div>
            <div class="justified_center bottom_connection dot"></div>
        </div>

        <div class="tree_node" style="position:absolute; top:300px; left:0">
            <div class="justified_center top_connection dot"></div>
            <div class="inner_body">
                <h1>Node Type</h1>
                <input class="node_input without_border extra_bottom_margin" type="text" value="Node Name"/>
                <table class="without_border">
                    <tr>
                        <td><label for="port_value">Port Name</label></td>
                        <td><input class="port node_input" type="text" name="port_value"/></td>
                    </tr>
                </table>        
            </div>
            <div class="justified_center bottom_connection dot"></div>
        </div>
    </div>
    <script src="treeScript.js"></script>
</body>
</html>
